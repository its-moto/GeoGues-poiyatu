<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="GamePlayStyles.css">
    <link rel="stylesheet" type="text/css" href="party.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="../src/maps.js"></script>
    <link rel="icon" href="../images/logo-pin.png"> <!-- ページアイコン -->
    <title>GeoPpoi - オンライン対戦</title>
</head>
<body class="party-page">
    <audio id="bgm" loop preload="auto"></audio>

    <!-- 参加画面 -->
    <div class="view" id="entryView">
        <h1 class="party-title">オンライン対戦</h1>
        <div class="entry-box">
            <label for="nameInput">なまえ</label>
            <input type="text" id="nameInput" maxlength="12" placeholder="なまえ">
            <label for="codeInput">部屋コード</label>
            <input type="text" id="codeInput" maxlength="4" placeholder="AB34" autocomplete="off">
            <button class="party-btn green" onclick="joinFromInput()">参加</button>
            <div class="entry-or">または</div>
            <button class="party-btn outline" onclick="createParty()">部屋を作る</button>
            <p id="entryError"></p>
        </div>
        <button class="goBack" onclick="location.href='../../index.html'">もどる</button>
    </div>

    <!-- ロビー -->
    <div class="view" id="lobbyView">
        <button class="goBack lobby-leave" onclick="leaveParty()">退出</button>
        <button class="sound-button lobby-sound" onclick="openSound()" title="サウンド">⚙</button>
        <div class="lobby-header">
            <div class="lobby-title" id="lobbyTitle"></div>
            <div class="lobby-code">コード<span id="lobbyCode"></span><button class="party-btn outline small" id="copyButton" onclick="copyInviteLink()">招待リンクをコピー</button></div>
            <div id="lobbyCount"></div>
        </div>
        <div class="lobby-teams">
            <div class="team-column blue" id="teamBlue"></div>
            <div class="lobby-center">
                <div class="vs-text">VS.</div>
                <button class="party-btn outline" id="switchButton" onclick="switchTeam()">⇄ スイッチ</button>
                <button class="party-btn outline host-only" onclick="shuffleTeams()">シャッフル</button>
            </div>
            <div class="team-column red" id="teamRed"></div>
        </div>
        <!-- 今の設定のカード (押すと設定のポップアップ) -->
        <div class="lobby-cards">
            <div class="lobby-card" onclick="openSettings()">
                <div class="lobby-card-value" id="cardMode"></div>
                <div class="lobby-card-label">モード</div>
            </div>
            <div class="lobby-card" onclick="openSettings()">
                <div class="lobby-card-value" id="cardMap"></div>
                <div class="lobby-card-label">マップ</div>
            </div>
            <div class="lobby-card" onclick="openSettings()">
                <div class="lobby-card-value" id="cardRule"></div>
                <div class="lobby-card-label">⚙ 設定</div>
            </div>
        </div>
        <button class="party-btn green host-only" id="startButton" onclick="startGame()">START GAME</button>
        <p id="lobbyMessage"></p>

        <!-- 設定のポップアップ -->
        <div id="settingsModal" onclick="if (event.target === this) closeSettings()">
            <div class="settings-panel">
                <h2>ゲーム設定</h2>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label for="modeSelect">モード</label>
                        <select id="modeSelect">
                            <option value="duel">1v1 デュエル</option>
                            <option value="team">チームデュエル</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="mapSelect">マップ</label>
                        <select id="mapSelect"></select>
                    </div>
                    <div class="setting-item">
                        <label for="timeSelect">時間</label>
                        <select id="timeSelect">
                            <option value="0">なし (guessされたら開始)</option>
                            <option value="30">30秒</option>
                            <option value="60">1分</option>
                            <option value="120">2分</option>
                            <option value="180">3分</option>
                        </select>
                    </div>
                    <!-- ◀ 数値 ▶ (押しっぱなしで連続で変わる) -->
                    <div class="setting-item">
                        <label>HP</label>
                        <div class="stepper" data-key="hp" data-min="1000" data-max="30000" data-step="1000">
                            <button type="button" data-dir="-1">◀</button>
                            <span class="stepper-value" id="hpValue"></span>
                            <button type="button" data-dir="1">▶</button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>だれかがguessしたら残り</label>
                        <div class="stepper" data-key="hurry" data-min="15" data-max="60" data-step="5">
                            <button type="button" data-dir="-1">◀</button>
                            <span class="stepper-value" id="hurryValue"></span>
                            <button type="button" data-dir="1">▶</button>
                        </div>
                    </div>
                </div>
                <div class="setting-slider">
                    <label for="multiStartSlider">倍率がかかり始めるラウンド: <span id="multiStartText"></span></label>
                    <input type="range" id="multiStartSlider" min="2" max="10" step="1">
                </div>
                <div class="setting-slider">
                    <label for="multiStepSlider">1ラウンドごとの倍率の上がり幅: <span id="multiStepText"></span></label>
                    <input type="range" id="multiStepSlider" min="0" max="1" step="0.1">
                </div>
                <p id="multiPreview"></p>
                <p class="settings-note" id="settingsNote"></p>
                <button class="party-btn green" onclick="closeSettings()">OK</button>
            </div>
        </div>
    </div>

    <!-- ラウンド開始前のカウントダウン -->
    <div class="view" id="introView">
        <div id="introRound"></div>
        <div id="introMultiplier"></div>
        <div class="intro-bottom">
            <div>次のラウンドが始まる</div>
            <div id="introCount"></div>
        </div>
    </div>

    <!-- プレイ画面 -->
    <div class="view" id="playView">
        <div id="loading"><div id="loadingtext">Loading...</div></div>

        <!-- loading="lazy"だとカウントダウン中(非表示)に読み込まれないので付けない -->
        <iframe id="streetview" src="" referrerpolicy="no-referrer-when-downgrade"></iframe>

        <!-- 左上: ストリートビューのembedに出る場所の表示を隠すためにも置いてる -->
        <div id="total"><span id="roundLabel"></span></div>
        <button class="itemIcon" onclick="backToStart()">🏳️</button>
        <button class="itemIcon" onclick="openSound()" style="bottom: 90px;">⚙</button>

        <div id="hpBar">
            <div class="hp-box blue">
                <div class="hp-label" id="playHpBlueLabel"></div>
                <div class="hp-track"><div class="hp-fill" id="playHpBlueFill"></div><div class="hp-text" id="playHpBlueText"></div></div>
                <div class="hp-players" id="playPlayersBlue"></div> <!-- プレイヤーのアイコン (guessしたら半透明) -->
            </div>
            <div class="hp-box red">
                <div class="hp-label" id="playHpRedLabel"></div>
                <div class="hp-track"><div class="hp-fill" id="playHpRedFill"></div><div class="hp-text" id="playHpRedText"></div></div>
                <div class="hp-players" id="playPlayersRed"></div> <!-- プレイヤーのアイコン (guessしたら半透明) -->
            </div>
        </div>

        <div class="timer" id="timer">
            <h1 id="countdown">00:00</h1>
            <div class="progress-overlay"></div>
        </div>
        <div id="guessStatus"></div>
        <div id="timerLowLeft"></div> <!-- 画面の端が赤く光るやつ -->


        <div id="map-container">
            <div id="map"></div> <!-- Leaflet地図の表示領域 -->
        </div>
        <button class="guess-button" id="guess-button" onclick="submitGuess(false)">guess</button>
    </div>

    <!-- ラウンド結果 -->
    <div class="view" id="resultView">
        <div id="resultMode"></div>
        <h2 id="resultTitle"></h2>
        <div class="result-map-wrap">
            <div id="partyResultMap"></div>
            <!-- HPバーは地図の下の両端に -->
            <div class="hp-box blue result-hp">
                <div class="hp-label" id="resultHpBlueLabel"></div>
                <div class="hp-track"><div class="hp-fill" id="resultHpBlueFill"></div><div class="hp-text" id="resultHpBlueText"></div></div>
            </div>
            <div class="hp-box red result-hp">
                <div class="hp-label" id="resultHpRedLabel"></div>
                <div class="hp-track"><div class="hp-fill" id="resultHpRedFill"></div><div class="hp-text" id="resultHpRedText"></div></div>
            </div>
        </div>
        <div class="result-table">
            <div class="result-distance" id="resultDistanceBlue"></div>
            <div class="result-label">場所からの距離</div>
            <div class="result-distance" id="resultDistanceRed"></div>

            <div class="result-nearest" id="resultNearestBlue"></div>
            <div class="result-label">最も近い推測</div>
            <div class="result-nearest" id="resultNearestRed"></div>

            <div class="result-score-cell"><span class="result-score" id="resultScoreBlue">0</span></div>
            <div class="result-label">ラウンド結果</div>
            <div class="result-score-cell"><span class="result-score" id="resultScoreRed">0</span></div>
        </div>
        <div id="resultMultiplier"></div>
        <button class="party-btn green host-only" id="nextButton" onclick="hostNext()">次のラウンド</button>
        <p id="resultWaiting"></p>
        <!-- 相手にぶつかっていく数字 -->
        <div id="flyNumber"></div>
        <div id="flyNumber2"></div>
    </div>

    <!-- 試合終了 -->
    <div class="view" id="gameOverView">
        <div id="winnerSub"></div>
        <div id="winnerText"></div>
        <button class="party-btn green host-only" onclick="backToLobby()">ロビーに戻る</button>
        <p id="gameOverWaiting"></p>
    </div>

    <!-- サウンドのポップアップ (ロビーとプレイ中の⚙から) -->
    <div id="soundModal" onclick="if (event.target === this) closeSound()">
        <div class="settings-panel">
            <h2>サウンド</h2>
            <div class="sound-row">
                <span>BGM</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="bgmOnToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-slider">
                <label for="bgmVolumeSlider">BGMの音量</label>
                <input type="range" id="bgmVolumeSlider" min="0" max="1" step="0.01">
            </div>
            <div class="setting-slider">
                <label for="seVolumeSlider">効果音の音量</label>
                <input type="range" id="seVolumeSlider" min="0" max="1" step="0.01">
            </div>
            <p class="settings-note">メニューやシングルのBGMの設定と共通だよ</p>
            <button class="party-btn green" onclick="closeSound()">OK</button>
        </div>
    </div>

    <script src="../src/sound.js"></script>
    <script src="../src/party.js"></script>
    <script src="../src/cssanimation.js"></script>
</body>
</html>
