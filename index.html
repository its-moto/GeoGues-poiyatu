<body class="menu-page">

	<!-- タイトル -->

		<span class="menu-logo-stroke">GEOGUESSR®っぽい何か</span>
		<span class="menu-logo-fill">GEOGUESSR®っぽい何か</span>
	</div>

	<!-- 左のメニュー -->
	<nav class="menu-list">
		<a class="menu-item big" href="singleplayer.html">シングルプレイヤー</a>
		<a class="menu-item big" href="Resource/maphtmls/party.html">オンライン対戦</a>
		<a class="menu-item big" href="Resource/maphtmls/game.html?daily=1">デイリーチャレンジ</a>
		<div class="menu-divider"></div>
		<a class="menu-item" href="javascript:openPopup()">設定</a>
		<a class="menu-item" href="README%20~私を読んで~.html">README</a>
		<span class="menu-item disabled">フレンド <span class="menu-soon">準備中</span></span>
		<a class="menu-item news" href="Resource/maphtmls/party.html">v2.1 オンライン対戦で遊べるよ!</a>
	</nav>

	<!-- 真ん中の地球 -->
	<div class="menu-stage">
		<div class="globe-glow"></div>
		<div class="globe">
			<div class="globe-strip" id="globeStrip"></div>
			<div class="globe-shade"></div>
		</div>
		<img class="globe-pin" src="Resource/images/pin.png" alt="">
		<button class="menu-play" onclick="location.href='singleplayer.html'">あそぶ</button>
	</div>

	<!-- 右下: コードで対戦に参加 -->
	<div class="menu-join">
		<div class="menu-join-title">部屋コードで参加</div>
		<div class="menu-join-row">
			<input type="text" id="joinCode" maxlength="4" placeholder="AB34" autocomplete="off">
			<button onclick="joinParty()">参加</button>
		</div>
	</div>

	<div class="menu-footer">
		<span>v2.1</span>
		powered by: Google Map, Leaflet, Visual Studio Code / made by it_s_moto, Inspired by GEOGUESSR, for my friends
	</div>

	<script src="Resource/src/settings.js"></script>
	<script>
		//================================================回る地球================================================
		// Googleの衛星写真のタイル(lyrs=s)を使って地球を作る
		// ズーム1だと世界全体が 2x2=4枚 のタイルになる (左上が x=0,y=0)
		//
		//   [x0,y0][x1,y0] ← 北半球
		//   [x0,y1][x1,y1] ← 南半球
		//
		// これを横に2セット並べた「帯」を作って、CSS(menu.cssのglobeSpin)で左に流し続ける
		// 1セットぶん進んだらアニメーションが最初に戻るので、つなぎ目なしでずっと回って見える
		const strip = document.getElementById('globeStrip'); // タイルを並べる帯

		for (let copy = 0; copy < 2; copy++) {     // 地球を2セット (1周目と2周目)
			for (let x = 0; x < 2; x++) {          // 横2枚
				for (let y = 0; y < 2; y++) {      // 縦2枚
					const tile = document.createElement('img');
					tile.src = `https://mt1.google.com/vt/lyrs=s&x=${x}&y=${y}&z=1`;

					// 帯は地球2セットぶん = タイル横4枚ぶんの幅なので、1枚の幅は25%
					// 左から copy*2+x 番目に置く (0,1 が1セット目、2,3 が2セット目)
					tile.style.left = (copy * 2 + x) * 25 + '%';
					// 縦は2枚なので1枚50%、y=1 なら下半分
					tile.style.top = y * 50 + '%';

					tile.alt = ''; // 飾りなので読み上げ不要
					strip.appendChild(tile);
				}
			}
		}

		//================================================部屋コードで参加================================================
		// 右下の入力欄にコードを入れて「参加」かEnterで、対戦ページに直接入る
		// party.html?code=AB34 で開くと、名前が保存されてればそのまま部屋に入れる (party.jsの最後のほう)
		function joinParty() {
			// 前後の空白を消して大文字にそろえる (ab34 → AB34)
			const code = document.getElementById('joinCode').value.trim().toUpperCase();

			// 英数字4文字じゃなかったら何もしないで入力欄に戻す
			if (!/^[A-Z0-9]{4}$/.test(code)) {
				document.getElementById('joinCode').focus();
				return;
			}
			location.href = 'Resource/maphtmls/party.html?code=' + code;
		}

		// 入力欄でEnterを押しても参加できるように
		document.getElementById('joinCode').addEventListener('keydown', event => {
			if (event.key === 'Enter') joinParty();
		});
	</script>
</body>

</html>
